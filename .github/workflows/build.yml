name: Сборка APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Ключ подписи из секретов
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "::error::Нет секрета KEYSTORE_BASE64 — выпуск без подписи невозможен"; exit 1; fi
            echo "::warning::Нет секрета KEYSTORE_BASE64 — собираю тестовую версию без подписи"
            echo "BEZ_PODPISI=1" >> "$GITHUB_ENV"; exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/argeda-ai.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/argeda-ai.jks" >> "$GITHUB_ENV"

      - name: Версия и нужен ли выпуск
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(grep -oP 'versionCode \K[0-9]+' app/build.gradle)
          NAME=$(grep -oP 'versionName ["\x27]\K[^"\x27]+' app/build.gradle)
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "${GITHUB_REF_NAME#v}" != "$NAME" ]; then echo "::error::Тег $GITHUB_REF_NAME не совпадает с versionName $NAME"; exit 1; fi
            echo "VYPUSK=1" >> "$GITHUB_ENV"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # новая versionName в main = новый выпуск (тег ставится сам)
            if ! gh release view "v$NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "VYPUSK=1" >> "$GITHUB_ENV"; fi
          fi

      - name: Сборка
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # пароли из телефона часто вставляются с пробелом или переводом строки — убираем
          chist() { printf %s "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          export KEYSTORE_PASSWORD="$(chist "$KEYSTORE_PASSWORD")"
          export KEY_PASSWORD="$(chist "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}")"
          export KEY_ALIAS="$(chist "${KEY_ALIAS:-argeda}")"
          if [ "${{ github.event_name }}" = "pull_request" ] || [ -n "$BEZ_PODPISI" ]; then
            gradle --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ARGEDA-AI-test.apk
          else
            gradle --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ARGEDA-AI.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs ARGEDA-AI.apk | grep -E 'SHA-256'
          fi

      - name: Файл версии для сайта
        if: env.VYPUSK == '1' && env.BEZ_PODPISI != '1'
        run: |
          CHTO=$(git log -1 --format=%s)
          python3 - <<PY
          import json, os
          json.dump({"versionCode": int(os.environ["VERSION_CODE"]), "versionName": os.environ["VERSION_NAME"],
                     "url": "/prilozhenie/ARGEDA-AI.apk", "chto": """$CHTO""".strip()},
                    open("versiya.json", "w"), ensure_ascii=False, indent=2)
          PY
          cat versiya.json

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            ARGEDA-AI*.apk
            versiya.json
          if-no-files-found: ignore

      - name: Выпуск в Releases
        if: env.VYPUSK == '1' && env.BEZ_PODPISI != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: ARGEDA AI ${{ env.VERSION_NAME }}
          files: |
            ARGEDA-AI.apk
            versiya.json
