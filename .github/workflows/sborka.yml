name: Сборка APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Ключ подписи из секретов
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Нет секрета KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/argeda-ai.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/argeda-ai.jks" >> "$GITHUB_ENV"

      - name: Версия из тега
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CODE=$(grep -oP 'versionCode \K[0-9]+' app/build.gradle)
          NAME=$(grep -oP 'versionName ["\x27]\K[^"\x27]+' app/build.gradle)
          if [ "$TAG" != "$NAME" ]; then echo "::error::Тег v$TAG не совпадает с versionName $NAME в app/build.gradle"; exit 1; fi
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Сборка
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gradle --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ARGEDA-AI-test.apk
          else
            gradle --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ARGEDA-AI.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs ARGEDA-AI.apk | grep -E 'SHA-256'
          fi

      - name: Файл версии для сайта
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          CHTO=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")
          python3 - <<PY
          import json, os
          json.dump({"versionCode": int(os.environ["VERSION_CODE"]), "versionName": os.environ["VERSION_NAME"],
                     "url": "/prilozhenie/ARGEDA-AI.apk", "chto": """$CHTO""".strip()},
                    open("versiya.json", "w"), ensure_ascii=False, indent=2)
          PY
          cat versiya.json

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            ARGEDA-AI*.apk
            versiya.json
          if-no-files-found: ignore

      - name: Выпуск в Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ARGEDA AI ${{ env.VERSION_NAME }}
          files: |
            ARGEDA-AI.apk
            versiya.json
