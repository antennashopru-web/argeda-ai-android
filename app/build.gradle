plugins { id 'com.android.application' }

def ksProps = new Properties()
def ksFile = rootProject.file('signing.properties')
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

android {
    namespace 'ru.argeda.ai'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.argeda.ai'
        minSdk 24
        targetSdk 35
        versionCode 23
        versionName "3.2"
    }
    signingConfigs {
        release {
            if (System.getenv('KEYSTORE_FILE')) {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS') ?: 'argeda'
                keyPassword System.getenv('KEY_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD')
            } else if (ksFile.exists()) {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

