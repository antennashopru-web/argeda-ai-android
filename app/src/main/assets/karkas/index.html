<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARGEDA</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* «Кинозал» — токены из Figma (TTB2UQneaynMGBABxbNbj0, Главная 390 / Тёмная) */
:root{--fon:#090b11;--pov1:#11141d;--pov2:#161a25;--liniya:rgba(255,255,255,.08);--knopka:rgba(255,255,255,.07);
  --tekst:#eef0f6;--tekst2:#8e95aa;--a1:#ffb45c;--a2:#ff6a55;--na-akcente:#1c0e05;--uspeh:#2fbf71;--oshibka:#f0524f;
  --a1t:#ffb45c;--tekst3:#d3d7e2;--slab:#6b7186;--shapka:rgba(9,11,17,.88);--panel:rgba(17,20,29,.94);--okno:#151925;--toast:#232838;--moy:#ffe2bd}
:root[data-theme=light]{--fon:#f5f6fa;--pov1:#ffffff;--pov2:#eef0f5;--liniya:rgba(17,20,29,.1);--knopka:rgba(17,20,29,.05);--tekst:#11141d;--tekst2:#5b6173;--tekst3:#2a2f3d;--slab:#7a8094;--a1t:#a84a0c;--uspeh:#1d8a50;--oshibka:#c93b38;--shapka:rgba(245,246,250,.9);--panel:rgba(255,255,255,.95);--okno:#ffffff;--toast:#11141d;--moy:#7a3608}
:root[data-theme=light] .tile,:root[data-theme=light] .hero,:root[data-theme=light] .bnr,:root[data-theme=light] .work,:root[data-theme=light] .pzz,:root[data-theme=light] .list,:root[data-theme=light] .note{box-shadow:0 2px 14px rgba(17,20,29,.06)}
.hero,.bnr,.tile .pod{color:#eef0f6}
.tile .pod small{color:#c3c8d6}
.hero .kicker{color:#ffb45c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fon);color:var(--tekst);font:400 15px/1.5 Onest,system-ui,sans-serif}
body{padding-bottom:104px;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.u{font-family:'Sofia Sans Extra Condensed',Onest,sans-serif;text-transform:uppercase;font-weight:800;letter-spacing:.01em}
/* шапка */
.top{position:sticky;top:0;z-index:5;background:var(--shapka);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--liniya)}
.top .wrap{display:flex;align-items:center;gap:10px;height:60px}
.top img{width:26px;height:26px;border-radius:7px}
.top b{font-family:'Sofia Sans Extra Condensed',Onest,sans-serif;text-transform:uppercase;font-weight:800;letter-spacing:.01em;font-size:24px;letter-spacing:.04em}
.chip{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;background:var(--knopka);border:1px solid var(--liniya);border-radius:99px;height:38px;padding:0 14px}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--oshibka);box-shadow:0 0 10px var(--oshibka)}
.chip.proverka i{background:var(--a1);box-shadow:0 0 10px var(--a1);animation:pulse .9s infinite alternate}
.chip.ok i{background:var(--uspeh);box-shadow:0 0 10px var(--uspeh)}
@keyframes pulse{to{opacity:.3}}
/* баннер главной */
.hero{position:relative;margin:16px 0 28px;border-radius:24px;overflow:hidden;background:var(--pov1);border:1px solid var(--liniya);min-height:470px}
.hero .svet{position:absolute;inset:0;pointer-events:none;opacity:.55}
.hero .foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 0}
.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,11,17,.15) 0%,rgba(9,11,17,.35) 40%,rgba(9,11,17,.92) 100%);pointer-events:none}
.hero .in{z-index:1}
.hero .in{position:relative;padding:42px 22px 22px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--a1t);margin-bottom:14px}
.hero h1{font-family:'Sofia Sans Extra Condensed',Onest,sans-serif;text-transform:uppercase;font-weight:800;letter-spacing:.01em;font-size:46px;line-height:.98;margin:0 0 16px}
.hero p{margin:0 0 26px;color:#c3c8d6;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:54px;padding:0 28px;border-radius:99px;font-weight:700;font-size:14.5px}
.btn.a{background:linear-gradient(90deg,var(--a1),var(--a2));color:var(--na-akcente);box-shadow:0 10px 34px rgba(255,140,80,.38)}
.btn.b{background:var(--knopka);border:1px solid var(--liniya)}
.hero .btn{min-width:186px}
.hero .btn.b{margin-top:12px}
.btn.w{width:100%;margin-top:10px}
.btn:disabled{opacity:.55}
/* заголовок блока */
.blok{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 16px}
.blok h2{font-family:'Sofia Sans Extra Condensed',Onest,sans-serif;text-transform:uppercase;font-weight:800;letter-spacing:.01em;font-size:25px;line-height:1;margin:0;white-space:nowrap}
.blok button{color:var(--tekst2);font-size:13px;font-weight:600;white-space:nowrap}
.sub{color:var(--tekst2);margin:-8px 0 16px;font-size:14px}
/* плитки разделов */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:30px}
.tile{position:relative;aspect-ratio:1;border-radius:20px;overflow:hidden;background:var(--pov1);border:1px solid var(--liniya);text-align:left}
.tile .art{position:absolute;inset:0;width:100%;height:100%}
.tile .pod{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 14px;background:linear-gradient(180deg,transparent,rgba(9,11,17,.85) 55%)}
.tile b{display:block;font-family:'Sofia Sans Extra Condensed',Onest,sans-serif;text-transform:uppercase;font-weight:800;letter-spacing:.01em;font-size:23px;line-height:1}
.tile small{display:block;color:var(--tekst2);font-size:12.5px;margin-top:3px}
.tile i{position:absolute;top:10px;right:10px;font-style:normal;font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;background:rgba(47,191,113,.16);color:var(--uspeh)}
/* плашка состояния */
.note{display:flex;gap:12px;align-items:flex-start;background:var(--pov1);border:1px solid var(--liniya);border-radius:20px;padding:16px;margin:0 0 28px}
.note svg{flex:none;width:22px;height:22px;stroke:var(--a1t);fill:none;stroke-width:2;margin-top:1px}
.note b{display:block;margin-bottom:3px;font-weight:700}
.note span{color:var(--tekst2);font-size:14px}
.note button{color:var(--a1t);font-weight:700;margin-top:8px;font-size:14px}
.note.ok svg{stroke:var(--uspeh)}
/* экран раздела */
.back{display:flex;align-items:center;gap:6px;color:var(--tekst2);margin:16px 0 12px;font-size:14px;font-weight:600}
.back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.bnr{position:relative;height:150px;border-radius:22px;overflow:hidden;background:var(--pov1);border:1px solid var(--liniya);margin-bottom:16px}
.bnr .art{position:absolute;inset:0;width:100%;height:100%}
.bnr:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(9,11,17,.88),rgba(9,11,17,.35) 70%,rgba(9,11,17,.1))}
.bnr .pod{position:absolute;left:18px;right:18px;bottom:16px;z-index:1}
.bnr b{display:block;font-family:'Sofia Sans Extra Condensed',Onest,sans-serif;text-transform:uppercase;font-weight:800;letter-spacing:.01em;font-size:34px;line-height:1}
.bnr small{display:block;color:#c3c8d6;font-size:13.5px;margin-top:4px}
.uses{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.uses span{font-size:13px;font-weight:600;background:var(--knopka);border:1px solid var(--liniya);border-radius:99px;padding:7px 12px;color:var(--tekst3)}
textarea{width:100%;min-height:140px;resize:vertical;background:var(--pov1);color:var(--tekst);border:1px solid var(--liniya);border-radius:18px;padding:14px 16px;font:400 15px/1.5 Onest,sans-serif;outline:none}
textarea:focus{border-color:rgba(255,180,92,.6)}
.hint{color:var(--tekst2);font-size:13px;margin:8px 2px 6px}
/* работы / файлы */
.works{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.work{border-radius:18px;overflow:hidden;background:var(--pov1);border:1px solid var(--liniya);text-align:left}
.work .pr{position:relative;height:108px;background:var(--pov2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.work .pr img{width:100%;height:100%;object-fit:cover}
.work .pr .art{position:absolute;inset:0;width:100%;height:100%}
.work .pr em{position:absolute;top:10px;left:10px;font-style:normal;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(47,191,113,.18);color:#5fd38d}
.work .pr em.zhdet{background:rgba(255,180,92,.18);color:var(--a1t)}
.work .pr .sh{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.work .pr .sh svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2}
.work .op{padding:11px 13px 13px}
.work .op b{display:block;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.work .op small{display:block;color:var(--tekst2);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.work .op .del{color:var(--tekst2);font-size:12px;font-weight:700;margin-top:6px}
.list{background:var(--pov1);border:1px solid var(--liniya);border-radius:20px;overflow:hidden;margin-bottom:28px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-top:1px solid var(--liniya)}
.row:first-child{border-top:0}
.row .x{flex:1;min-width:0}
.row b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{color:var(--tekst2);font-size:12.5px}
.row>svg{width:18px;height:18px;stroke:var(--tekst2);fill:none;stroke-width:2;flex:none}
.row .ik{width:38px;height:38px;border-radius:12px;flex:none;background:var(--knopka);display:flex;align-items:center;justify-content:center}
.row .ik svg{width:19px;height:19px;stroke:var(--a1t);fill:none;stroke-width:2}
.empty{color:var(--tekst2);font-size:14px;border:1px dashed var(--liniya);border-radius:18px;padding:16px;margin-bottom:12px}
h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--tekst2);margin:26px 0 12px;font-weight:700}
.title{font-family:'Sofia Sans Extra Condensed',Onest,sans-serif;text-transform:uppercase;font-weight:800;letter-spacing:.01em;font-size:38px;line-height:1;margin:22px 0 8px}
/* нижняя панель */
nav{position:fixed;left:12px;right:12px;bottom:12px;z-index:6;max-width:520px;margin:0 auto;height:72px;display:flex;align-items:center;justify-content:space-around;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--liniya);border-radius:24px}
nav button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--tekst2);min-width:66px}
nav .ik{width:24px;height:24px;border-radius:7px;border:2px solid currentColor}
nav button.on{color:var(--tekst)}
nav .plus{width:40px;height:30px;border-radius:10px;background:linear-gradient(90deg,var(--a1),var(--a2));display:flex;align-items:center;justify-content:center;margin-top:-2px}
nav .plus svg{width:18px;height:18px;stroke:var(--na-akcente);stroke-width:2.6;fill:none}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--toast);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
.foot{color:var(--tekst2);font-size:12px;text-align:center;margin:22px 0}
/* примеры работ */
.lenta{display:flex;gap:10px;overflow-x:auto;margin:0 -16px 30px;padding:0 16px;scroll-snap-type:x mandatory;scrollbar-width:none}
.lenta::-webkit-scrollbar{display:none}
.pm{flex:none;width:150px;scroll-snap-align:start;text-align:left}
.pm .kd{position:relative;display:block;aspect-ratio:9/16;border-radius:18px;overflow:hidden;background:var(--pov1);border:1px solid var(--liniya)}
.pm.f .kd{aspect-ratio:3/4}
.pm.c{width:128px}
.pm .kd video,.pm .kd img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pm .kd i{position:absolute;left:8px;top:8px;font-style:normal;font-size:11px;font-weight:700;padding:4px 8px;border-radius:99px;background:rgba(9,11,17,.62);color:#fff;backdrop-filter:blur(6px)}
.pm b{display:block;font-weight:700;font-size:13.5px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm small{display:block;color:var(--tekst2);font-size:12px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.razdel-pr{margin-bottom:6px}
.razdel-pr .lenta{margin-bottom:18px}
#pros{position:fixed;inset:0;z-index:20;background:rgba(5,6,10,.96);display:none;flex-direction:column;align-items:center;justify-content:center;padding:56px 16px 24px}
#pros.on{display:flex}
#pros .x{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;background:var(--knopka);display:flex;align-items:center;justify-content:center}
#pros .x svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2}
#pros .med{max-width:100%;max-height:58vh;border-radius:20px;background:#000}
#pros .tx{width:100%;max-width:420px;margin-top:16px}
#pros .tx b{display:block;font-family:'Sofia Sans Extra Condensed',Onest,sans-serif;text-transform:uppercase;font-weight:800;letter-spacing:.01em;font-size:26px;line-height:1}
#pros .tx small{display:block;color:var(--tekst2);font-size:13.5px;margin-top:4px}
#pros .tx em{display:block;font-style:normal;color:#6b7186;font-size:11.5px;margin-top:6px}
/* прямой режим */
.pz input[type=password],.pz input[type=text]{width:100%;background:var(--pov1);color:var(--tekst);border:1px solid var(--liniya);border-radius:16px;padding:14px 16px;font:400 15px Onest,sans-serif;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chips button{font-size:13.5px;font-weight:700;background:var(--knopka);border:1px solid var(--liniya);border-radius:99px;padding:8px 14px;color:var(--tekst3)}
.chips button.on{background:linear-gradient(90deg,var(--a1),var(--a2));color:var(--na-akcente);border-color:transparent}
.pzz{background:var(--pov1);border:1px solid var(--liniya);border-radius:18px;padding:14px;margin-bottom:12px}
.pzz p{margin:0 0 8px;font-size:14px;color:var(--tekst3);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pzz small{color:var(--tekst2);font-size:12.5px}
.pzz .rez{display:block;width:100%;border-radius:14px;margin:6px 0 10px;background:#000}
.pzz audio{width:100%;margin:6px 0 10px}
.pzz .ry,.mz .ry{display:flex;gap:8px;flex-wrap:wrap}
.mz .ry button:disabled{opacity:.5}
.pzz .ry button,.mz .mzr button{font-size:13px;font-weight:700;padding:8px 12px;border-radius:12px;background:var(--knopka);color:var(--tekst)}
.pzz .st{font-weight:700;font-size:12.5px}
.pzz .st.idet{color:var(--a1t)}.pzz .st.gotovo{color:var(--uspeh)}.pzz .st.oshibka{color:var(--oshibka,#f0524f)}
.forma{margin-bottom:12px}
.pf{margin-bottom:12px}
.pl{display:block;font-size:12.5px;font-weight:700;color:var(--tekst2);margin:0 0 6px}
.pd{display:block;color:var(--slab);font-size:11.5px;margin-top:4px;line-height:1.35}
.pf input[type=text],.pf input[type=number],.pf select,.pz select{width:100%;background:var(--pov1);color:var(--tekst);border:1px solid var(--liniya);border-radius:14px;padding:12px 14px;font:400 15px Onest,sans-serif;outline:none;-webkit-appearance:none;appearance:none}
.pz{margin-bottom:14px}
.pf textarea{min-height:70px}
.tg{display:flex;align-items:center;gap:8px;font-size:15px}
.tg input{width:20px;height:20px;accent-color:var(--a1)}
.fl{display:flex;flex-wrap:wrap;gap:8px}
.fi{font-size:12.5px;background:var(--knopka);border:1px solid var(--liniya);border-radius:10px;padding:6px 8px}
.fi button{color:var(--tekst2);font-weight:700;margin-left:4px}
.fb{font-size:13.5px;font-weight:700;padding:9px 14px;border-radius:12px;border:1px dashed rgba(255,150,80,.6);color:var(--a1t)}
details{background:var(--pov1);border:1px solid var(--liniya);border-radius:16px;padding:12px 14px;margin-bottom:12px}
details summary{font-weight:700;font-size:14px;cursor:pointer}
details[open] summary{margin-bottom:12px}
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.msg{padding:10px 13px;border-radius:16px;font-size:14.5px;max-width:88%;white-space:normal;word-wrap:break-word}
.msg.user{align-self:flex-end;background:rgba(255,180,92,.18);color:var(--moy)}
.msg.assistant{align-self:flex-start;background:var(--pov1);border:1px solid var(--liniya)}
#dlg{position:fixed;inset:0;z-index:30;background:rgba(5,6,10,.7);display:none;align-items:center;justify-content:center;padding:16px}
#dlg.on{display:flex}
#dlg .dl{background:var(--okno);border:1px solid var(--liniya);border-radius:20px;padding:18px;max-width:380px;width:100%}
#dlg p{margin:0 0 16px;font-size:15.5px}
#dlg .ry{display:flex;gap:10px}
#dlg .btn{flex:1;min-width:0}
.mz h2{font-size:22px;margin:0}.mzh{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
.mzl{background:none;border:0;color:var(--a1t,#f59e0b);font:inherit;font-weight:700;font-size:14px;padding:6px 0}
.mzt3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}.mzt3 button{justify-content:center}
.mzs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}.mzs button{background:none;border:0;border-bottom:3px solid var(--liniya);color:var(--tekst2);font:inherit;font-weight:700;font-size:13px;padding:8px 0;display:flex;align-items:center;gap:6px;justify-content:center}
.mzs button i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--pov1);display:inline-grid;place-items:center;font-size:12px}
.mzs button.on{border-color:#ff9a3c;color:var(--tekst)}.mzs button.on i{background:linear-gradient(135deg,#ffb35c,#ff6a4d);color:#111}.mzs button.off{opacity:.45}
.mzd{border:1px solid var(--liniya);border-radius:16px;padding:12px 14px;margin:10px 0;background:var(--pov1)}.mzd summary{font-weight:700;cursor:pointer}
.mzc{margin-bottom:10px}.mz .pl{margin-top:12px}.mz textarea,.mz input[type=text]{width:100%;box-sizing:border-box}
.mzt{display:flex;gap:6px;align-items:center;border-top:1px solid var(--liniya);padding:8px 0}.mzt-o{flex:1;text-align:left;background:none;border:0;color:var(--tekst);font:inherit;padding:0}.mzt-o small{display:block;color:var(--tekst3);font-size:12px}
.mzt-x{background:none;border:0;color:var(--tekst3);font-size:20px;padding:0 6px}.mzr{margin:8px 0 12px}
.mzi{border:1px solid var(--liniya);border-radius:16px;padding:12px 14px;background:var(--pov1);margin-bottom:6px}.mzi small{display:block;color:var(--tekst3);margin:4px 0 8px}.mzi button{background:none;border:0;color:var(--a1t,#f59e0b);font:inherit;font-weight:700;padding:0}
</style>
</head>
<body>
<div class="top"><div class="wrap"><button class="logo" data-go="glavnaya" style="display:flex;align-items:center;gap:10px"><img src="logo.png" alt=""><b>ARGEDA</b></button><span class="chip" id="chip"><i></i><span id="chip-t">Подключаюсь…</span></span></div></div>
<main class="wrap" id="app"></main>
<nav id="nav">
  <button data-go="glavnaya"><span class="ik"></span>Главная</button>
  <button data-go="sozdat"><span class="plus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>Создать</button>
  <button data-go="fayly"><span class="ik"></span>Мои файлы</button>
  <button data-go="kabinet"><span class="ik"></span>Кабинет</button>
</nav>
<div class="toast" id="toast"></div>
<div id="pros"></div>
<div id="dlg"></div>
<input type="file" id="pz-fayl" style="display:none">

<script src="modeli.js"></script>
<script>
(function(){
