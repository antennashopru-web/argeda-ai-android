<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARGEDA AI</title>
<style>
:root{--bg:#0f1113;--card:#181b1f;--card2:#1f2328;--line:#2a2f36;--text:#f2f2f2;--muted:#9aa0ad;--accent:#ffb35c;--ok:#5fd38d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:16px 16px 40px;max-width:640px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;margin:4px 0 16px}
header img{width:36px;height:36px;border-radius:9px}
header b{font-size:19px;letter-spacing:.3px}
header span{margin-left:auto;color:var(--muted);font-size:12px}
.status{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:22px}
.status h1{font-size:17px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#e5534b;flex:none}
.proverka .dot{background:var(--accent);animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.3}}
.status p{margin:0 0 12px;color:var(--muted);font-size:14px}
button{font:inherit;border:0;border-radius:12px;cursor:pointer}
.btn{background:var(--accent);color:#1a1205;font-weight:600;padding:11px 18px;width:100%}
.btn:disabled{opacity:.6}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:0 0 10px;font-weight:600}
section{margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px 10px;text-align:center;color:var(--text);position:relative;min-width:0}
.tile svg{width:26px;height:26px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile div{font-size:12px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile i{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.files{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.f{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.f img{width:100%;height:100%;object-fit:cover;display:block}
.f svg{width:30px;height:30px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.f .n{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;font-size:11px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f .sh{position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
.f .sh svg{width:15px;height:15px;stroke:#fff}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);color:var(--text);width:100%;background:none;text-align:left;border-radius:0}
.row:first-child{border-top:0}
.row div{flex:1;min-width:0}
.row b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{color:var(--muted);font-size:12px}
.row svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.empty{color:var(--muted);font-size:14px;background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:14px}
.link{background:none;color:var(--accent);padding:8px 0 0;font-size:14px}
.more{display:block;margin-top:8px;background:var(--card2);color:var(--text);padding:10px;width:100%}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:8px}
@media (max-width:360px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header><img src="logo.png" alt=""><b>ARGEDA AI</b><span id="ver"></span></header>

<div class="status" id="status">
  <h1><span class="dot"></span><span id="st-title">Сайт сейчас недоступен</span></h1>
  <p id="st-text">Приложение работает и без него: ваши файлы и сохранённые страницы ниже. Связь проверяется сама.</p>
  <button class="btn" id="retry">Повторить</button>
</div>

<section>
  <h2>Разделы</h2>
  <div class="grid" id="razdely"></div>
</section>

<section>
  <h2>Сохранено на телефоне</h2>
  <div id="fayly"></div>
</section>

<section>
  <h2>Недавние страницы</h2>
  <div id="stranitsy"></div>
</section>

<footer>Эта часть приложения работает без интернета</footer>

<script>
(function(){
var K = window.ArgedaKarkas;
var I = {
  video:'<path d="M3 6h12v12H3z"/><path d="M15 10l6-3v10l-6-3"/>',
  kartinki:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/>',
  muzyka:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
  golos:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/>',
  kino:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M7 5v4M12 5v4M17 5v4"/>',
  nastavnik:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8"/>',
  wb:'<path d="M4 7h16l-1.5 12h-13z"/><path d="M9 7a3 3 0 016 0"/>',
  papka:'<path d="M3 6h6l2 2h10v11H3z"/>',
  fayl:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>',
  share:'<path d="M12 3v12M7 8l5-5 5 5M5 14v6h14v-6"/>',
  dalee:'<path d="M9 6l6 6-6 6"/>'
};
function svg(k){return '<svg viewBox="0 0 24 24">'+I[k]+'</svg>'}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function parse(s){try{return JSON.parse(s)||[]}catch(e){return []}}
function kogda(t){
  var d=new Date(t), now=new Date(), m=Math.round((now-d)/60000);
  if(m<1) return 'только что'; if(m<60) return m+' мин назад';
  var h=Math.round(m/60); if(h<24) return h+' ч назад';
  return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
}

var RAZDELY=[
  ['Видео','/video','video'],['Картинки','/kartinki','kartinki'],['Музыка','/muzyka','muzyka'],['Голос','/golos','golos'],
  ['Кино','/kino','kino'],['Наставник','/nastavnik','nastavnik'],['Карточки','/instrument/infografika','wb'],['Мои файлы','/moi-fayly','papka']
];

function risovat(){
  var stranitsy = K ? parse(K.stranitsy()) : [];
  var est = {}; stranitsy.forEach(function(s){est[s.path]=1});

  document.getElementById('razdely').innerHTML = RAZDELY.map(function(r){
    return '<button class="tile" data-p="'+r[1]+'">'+(est[r[1]]?'<i title="есть копия"></i>':'')+svg(r[2])+'<div>'+r[0]+'</div></button>';
  }).join('');

  var fayly = K ? parse(K.fayly()) : [];
  var box = document.getElementById('fayly');
  if(!fayly.length){
    box.innerHTML='<div class="empty">Здесь появятся картинки, видео и музыка, которые вы сохраните с сайта. Они открываются без интернета.</div><button class="link" id="gal">Открыть галерею телефона</button>';
  } else {
    var pokaz = box.dataset.vse ? fayly : fayly.slice(0,9);
    box.innerHTML='<div class="files">'+pokaz.map(function(f,i){
      var m=f.mime||'', vid;
      if(m.indexOf('image/')===0) vid='<img loading="lazy" src="'+esc(f.uri)+'" alt="" onerror="this.style.display=\'none\'">';
      else vid=svg(m.indexOf('video/')===0?'video':m.indexOf('audio/')===0?'muzyka':'fayl');
      return '<div class="f" data-i="'+i+'">'+vid+'<span class="sh" data-s="'+i+'">'+svg('share')+'</span><div class="n">'+esc(f.name)+'</div></div>';
    }).join('')+'</div>'+(fayly.length>9&&!box.dataset.vse?'<button class="more" id="vse">Показать все ('+fayly.length+')</button>':'');
    box._f = pokaz;
  }

  var sb = document.getElementById('stranitsy');
  sb.innerHTML = stranitsy.length
    ? '<div class="list">'+stranitsy.map(function(s){
        return '<button class="row" data-k="'+esc(s.path)+'"><div><b>'+esc((s.title||s.path).replace(/\s*[|·—-]\s*ARGEDA AI\s*$/i,''))+'</b><small>'+esc(s.path)+' · '+kogda(s.t)+'</small></div>'+svg('dalee')+'</button>';
      }).join('')+'</div>'
    : '<div class="empty">Страницы сайта, которые вы открывали, сохраняются сами — их можно будет посмотреть без интернета.</div>';
}

document.addEventListener('click', function(e){
  var t=e.target.closest('button,.f,.sh'); if(!t||!K) return;
  if(t.id==='retry'){ sostoyanie('proverka'); K.povtorit(); return; }
  if(t.id==='gal'){ K.galereya(); return; }
  if(t.id==='vse'){ document.getElementById('fayly').dataset.vse='1'; risovat(); return; }
  if(t.dataset.p){ K.razdel(t.dataset.p); return; }
  if(t.dataset.k){ K.kopiya(t.dataset.k); return; }
  var f=document.getElementById('fayly')._f||[];
  if(t.dataset.s!=null){ e.stopPropagation(); var x=f[+t.dataset.s]; if(x) K.podelitsya(x.uri,x.mime); return; }
  if(t.dataset.i!=null){ var y=f[+t.dataset.i]; if(y) K.otkrytFayl(y.uri,y.mime); }
});

function sostoyanie(s){
  var box=document.getElementById('status'), b=document.getElementById('retry');
  var set = K ? K.set() : navigator.onLine;
  if(s==='proverka'){
    box.className='status proverka';
    document.getElementById('st-title').textContent='Проверяю связь…';
    b.disabled=true; b.textContent='Подключаюсь…';
  } else {
    box.className='status';
    document.getElementById('st-title').textContent = set ? 'Сайт сейчас недоступен' : 'Нет интернета';
    document.getElementById('st-text').textContent = set
      ? 'Приложение работает и без него: ваши файлы и сохранённые страницы ниже. Связь проверяется сама каждые 30 секунд.'
      : 'Включите мобильный интернет или Wi‑Fi — приложение подключится само. Пока можно посмотреть сохранённое ниже.';
    b.disabled=false; b.textContent='Повторить';
  }
}

// called by the app
window.karkasObnovit=function(s){ sostoyanie(s); risovat(); };

if(K){ var v=K.versiya(); if(v) document.getElementById('ver').textContent='версия '+v; }
sostoyanie('net'); risovat();

// automatic check while the shell is open
setInterval(function(){
  if(document.hidden||!K) return;
  if(K.set() && !document.getElementById('retry').disabled){ sostoyanie('proverka'); K.povtorit(); }
}, 30000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) risovat(); });
})();
</script>
</body>
</html>
